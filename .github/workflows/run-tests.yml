name: CI - Test API

on:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

env:
  DOCKER_HUB_USERNAME: mihajlovicka
  IMAGE_NAME: mihajlovicka/booking
  SERVICE_NAME: user-service

jobs:
  build-and-test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out frontend repo (for docker-compose)
        uses: actions/checkout@v4
        with:
          repository: Mihajlovicka/booking-app-frontend
          ref: develop
          path: frontend-repo

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
          args: -X
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Image with Cache
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          target: test
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.SERVICE_NAME }}-test
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:${{ env.SERVICE_NAME }}-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:${{ env.SERVICE_NAME }}-buildcache,mode=max

      - name: Set up Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.3.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Set Docker secrets as environment variables
        run: |
          echo "DB_USER=${{ secrets.DB_USER }}" > frontend-repo/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> frontend-repo/.env
          echo "IMAGE_NAME=${{ env.IMAGE_NAME }}" >> frontend-repo/.env
          echo "SERVICE_NAME=${{ env.SERVICE_NAME }}" >> frontend-repo/.env
          echo "DOCKER_BUILDKIT=1" >> frontend-repo/.env

      - name: Build and run tests with Docker Compose from frontend repo
        run: |
          docker-compose -f frontend-repo/docker-compose.test.yml up -d testing-service
          docker-compose -f frontend-repo/docker-compose.test.yml logs -f testing-service
          docker-compose -f frontend-repo/docker-compose.test.yml run --rm testing-service

      - name: Clean up Docker Compose
        if: always()
        run: docker-compose -f frontend-repo/docker-compose.test.yml down

